<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香氛罗盘 · 找到属于你的那一支香水</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink-50:#fff7fa; --pink-100:#ffeaf3; --pink-200:#ffd7e7; --pink-300:#ffbcd7;
  --rose:#e97ba4; --rose-deep:#c9568a; --rose-dark:#a8416e;
  --plum:#43202f; --plum-2:#6d3c52; --plum-3:#8d6274;
  --gold:#c8a05c; --gold-soft:#efdcb8; --cream:#fffaf6;
  --sh-soft:0 12px 30px -16px rgba(160,70,110,.35);
  --sh:0 22px 48px -22px rgba(160,70,110,.45);
  --serif:'Noto Serif SC','Songti SC','STSong',Georgia,serif;
  --sans:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --en:'Cormorant Garamond',Georgia,serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--plum); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(1100px 650px at 8% -12%, #ffe4ef 0%, transparent 62%),
    radial-gradient(900px 600px at 102% 2%, #fdeee2 0%, transparent 58%),
    radial-gradient(1000px 780px at 50% 118%, #ffe8f4 0%, transparent 62%),
    linear-gradient(180deg,#fffbfd 0%,#fff6fa 55%,#fdf0f6 100%);
  background-attachment:fixed;
}
/* ---------- 背景装饰 ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(60px);opacity:.55}
.aurora i:nth-child(1){width:420px;height:420px;left:-120px;top:8%;background:#ffc9de;animation:float1 18s ease-in-out infinite}
.aurora i:nth-child(2){width:340px;height:340px;right:-100px;top:28%;background:#ffe2c9;animation:float2 22s ease-in-out infinite}
.aurora i:nth-child(3){width:300px;height:300px;left:35%;bottom:-140px;background:#ffd4ea;animation:float1 26s ease-in-out infinite reverse}
.aurora i:nth-child(4){width:200px;height:200px;right:22%;top:6%;background:#f6d9ff;opacity:.4;animation:float2 20s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,26px)}}
.sparkles{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(1.6px 1.6px at 12% 22%, rgba(255,255,255,.9), transparent),
    radial-gradient(1.4px 1.4px at 78% 12%, rgba(255,255,255,.85), transparent),
    radial-gradient(1.8px 1.8px at 62% 74%, rgba(255,255,255,.8), transparent),
    radial-gradient(1.3px 1.3px at 26% 82%, rgba(255,255,255,.85), transparent),
    radial-gradient(1.5px 1.5px at 90% 56%, rgba(255,255,255,.75), transparent);
  opacity:.9}
/* ---------- 顶栏 ---------- */
.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:20px clamp(16px,4vw,54px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;font:inherit;color:inherit;text-align:left}
.brand svg{width:42px;height:42px;filter:drop-shadow(0 6px 10px rgba(200,90,140,.28))}
.brand h1{font-family:var(--serif);font-size:19px;letter-spacing:.14em;font-weight:600;line-height:1.1}
.brand p{font-family:var(--en);font-size:11px;letter-spacing:.34em;color:var(--rose-deep);text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:10px;align-items:center}
.chipbtn{font:inherit;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;
  border:1px solid var(--pink-200);background:rgba(255,255,255,.75);color:var(--plum-2);
  backdrop-filter:blur(8px);transition:.25s}
.chipbtn:hover{border-color:var(--rose);color:var(--rose-dark);box-shadow:0 8px 18px -10px rgba(200,90,140,.6);transform:translateY(-1px)}
/* ---------- 主容器 ---------- */
main{position:relative;z-index:3;width:min(1180px,92vw);margin:0 auto;padding-bottom:70px}
.view{animation:rise .55s cubic-bezier(.22,.9,.28,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* ---------- Hero ---------- */
.hero{text-align:center;padding:clamp(18px,4vw,44px) 0 clamp(28px,5vw,52px)}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.28em;color:var(--rose-deep);
  border:1px solid var(--pink-200);background:rgba(255,255,255,.7);border-radius:999px;padding:7px 18px;margin-bottom:22px}
.hero-title{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5.4vw,54px);line-height:1.32;letter-spacing:.02em}
.hero-title em{font-style:normal;position:relative;color:var(--rose-dark);white-space:nowrap}
.hero-title em::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:9px;
  background:linear-gradient(90deg,rgba(255,188,215,.75),rgba(255,215,231,.35));border-radius:8px;z-index:-1}
.hero-sub{max-width:660px;margin:22px auto 0;font-size:15px;line-height:2;color:var(--plum-2)}
.hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btn{font:inherit;font-size:14.5px;padding:14px 30px;border-radius:999px;cursor:pointer;border:1px solid transparent;transition:.28s;letter-spacing:.04em}
.btn-primary{color:#fff;background:linear-gradient(135deg,#f08cb2,#d9628f 55%,#c9568a);
  box-shadow:0 16px 30px -14px rgba(200,86,138,.85)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 38px -14px rgba(200,86,138,.95)}
.btn-ghost{background:rgba(255,255,255,.8);border-color:var(--pink-200);color:var(--plum-2)}
.btn-ghost:hover{border-color:var(--rose);color:var(--rose-dark);transform:translateY(-2px)}
.hero-notes{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:34px;font-size:12.5px;color:var(--plum-3);letter-spacing:.1em}
.hero-notes span{display:flex;align-items:center;gap:8px}
.hero-notes span::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--rose);display:inline-block}
/* ---------- 香调卡片网格 ---------- */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:14px 0 22px;flex-wrap:wrap}
.section-head h2{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.06em}
.section-head p{font-size:13px;color:var(--plum-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:18px}
.fam-card{position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;
  border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:22px 20px 20px;
  background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,240,246,.78));
  box-shadow:var(--sh-soft);backdrop-filter:blur(10px);transition:.32s cubic-bezier(.22,.9,.28,1);
  display:flex;flex-direction:column;gap:9px;overflow:hidden;animation:rise .5s both;animation-delay:var(--d,0ms)}
.fam-card::before{content:'';position:absolute;inset:0;border-radius:22px;padding:1px;
  background:linear-gradient(150deg,rgba(255,188,215,.9),rgba(255,255,255,0),rgba(239,220,184,.8));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.32s}
.fam-card::after{content:'';position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,188,215,.55),transparent 70%);transition:.4s}
.fam-card:hover{transform:translateY(-7px);box-shadow:var(--sh);border-color:rgba(255,255,255,1)}
.fam-card:hover::before{opacity:1}
.fam-card:hover::after{transform:scale(1.35)}
.fc-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(140deg,#fff,#ffe6f0);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 8px 16px -10px rgba(200,86,138,.7)}
.fc-name{font-family:var(--serif);font-size:18.5px;font-weight:600;letter-spacing:.06em;display:flex;align-items:baseline;gap:8px}
.fc-name em{font-family:var(--en);font-style:italic;font-size:12.5px;color:var(--rose-deep);letter-spacing:.06em}
.fc-tag{font-size:12.8px;line-height:1.75;color:var(--plum-3)}
.fc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.fc-chips i{font-style:normal;font-size:11px;padding:4px 9px;border-radius:999px;background:rgba(255,188,215,.28);color:var(--rose-dark)}
.fc-cta{margin-top:8px;font-size:12.5px;color:var(--rose-deep);letter-spacing:.08em;opacity:.85;transition:.3s}
.fam-card:hover .fc-cta{letter-spacing:.16em;opacity:1}
/* ---------- 香调详情 ---------- */
.backlink{font:inherit;background:none;border:0;cursor:pointer;color:var(--plum-3);font-size:13px;padding:6px 0;letter-spacing:.06em;transition:.25s}
.backlink:hover{color:var(--rose-dark)}
.fam-hero{margin-top:18px;border-radius:28px;padding:clamp(24px,4vw,44px);position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(255,235,244,.85));border:1px solid #fff;box-shadow:var(--sh-soft)}
.fam-hero::after{content:'';position:absolute;right:-70px;bottom:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,188,215,.6),transparent 68%)}
.fh-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative;z-index:2}
.fh-icon{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font-size:32px;
  background:linear-gradient(140deg,#fff,#ffe1ee);box-shadow:0 12px 24px -14px rgba(200,86,138,.8)}
.fh-title{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);font-weight:600;letter-spacing:.08em}
.fh-title em{font-family:var(--en);font-style:italic;font-size:16px;color:var(--rose-deep);letter-spacing:.12em;margin-left:10px;font-weight:500}
.fh-tag{font-size:13.5px;color:var(--plum-2);margin-top:8px;letter-spacing:.04em}
.fh-body{position:relative;z-index:2;margin-top:22px;display:grid;gap:12px}
.fh-body p{font-size:14.6px;line-height:2.1;color:var(--plum-2);text-align:justify}
.fh-body p.first::first-letter{font-family:var(--serif);font-size:34px;float:left;line-height:1;padding:6px 10px 0 0;color:var(--rose-deep)}
.fh-meta{position:relative;z-index:2;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:26px}
.mbox{background:rgba(255,255,255,.72);border:1px solid #fff;border-radius:18px;padding:16px 18px}
.mbox h4{font-family:var(--serif);font-size:13.5px;letter-spacing:.12em;color:var(--rose-dark);margin-bottom:10px;font-weight:600}
.mbox .tags{display:flex;gap:7px;flex-wrap:wrap}
.mbox .tags i{font-style:normal;font-size:11.5px;padding:5px 11px;border-radius:999px;background:linear-gradient(135deg,#fff,#ffe9f2);
  box-shadow:inset 0 0 0 1px rgba(255,188,215,.6);color:var(--plum-2)}
.mbox .tags i.gold{background:linear-gradient(135deg,#fff,#fdf1dd);box-shadow:inset 0 0 0 1px var(--gold-soft);color:#8a6b2e}
.axes-list{display:grid;gap:9px}
.axes-list div{font-size:13px;color:var(--plum-2);display:flex;align-items:center;gap:9px}
.axes-list div b{width:6px;height:6px;border-radius:50%;background:var(--rose);flex:none}
/* 预览香水 */
.preview{margin-top:34px}
.preview h3{font-family:var(--serif);font-size:16px;letter-spacing:.1em;margin-bottom:14px;font-weight:600}
.pv-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pv{border:1px solid #fff;background:rgba(255,255,255,.68);border-radius:16px;padding:14px 16px;transition:.3s}
.pv:hover{background:#fff;transform:translateY(-3px);box-shadow:var(--sh-soft)}
.pv h5{font-family:var(--serif);font-size:14.5px;font-weight:600;letter-spacing:.04em}
.pv span{display:block;font-size:12.5px;color:var(--plum-3);margin-top:6px;line-height:1.7}
.pv i{font-style:normal;font-size:10.5px;padding:3px 8px;border-radius:999px;background:rgba(255,188,215,.3);color:var(--rose-dark);display:inline-block;margin-top:9px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px;align-items:center}
.hint{font-size:12.5px;color:var(--plum-3)}
/* ---------- 测试 ---------- */
.quiz{max-width:760px;margin:22px auto 0}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.qcount{font-size:12.5px;letter-spacing:.16em;color:var(--rose-deep)}
.bar{height:6px;border-radius:999px;background:rgba(255,188,215,.3);overflow:hidden;margin-bottom:34px}
.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffc2da,#e97ba4);transition:width .45s cubic-bezier(.22,.9,.28,1)}
.qcard{background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,240,247,.82));border:1px solid #fff;
  border-radius:26px;padding:clamp(22px,3.6vw,38px);box-shadow:var(--sh-soft);backdrop-filter:blur(10px)}
.qtext{font-family:var(--serif);font-size:clamp(19px,2.5vw,24px);font-weight:600;line-height:1.7;letter-spacing:.03em;margin-bottom:26px}
.qtext::before{content:'Q';font-family:var(--en);color:var(--rose);margin-right:10px;font-size:1.1em}
.opts{display:grid;gap:12px}
.opt{font:inherit;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:flex-start;
  padding:16px 20px;border-radius:16px;border:1px solid rgba(255,188,215,.55);background:rgba(255,255,255,.7);
  color:var(--plum);transition:.26s cubic-bezier(.22,.9,.28,1);line-height:1.7;font-size:14.6px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);
  font-size:13px;font-weight:600;background:rgba(255,188,215,.35);color:var(--rose-dark);transition:.26s}
.opt:hover{border-color:var(--rose);background:#fff;transform:translateX(5px);box-shadow:0 14px 26px -18px rgba(200,86,138,.9)}
.opt:hover b{background:var(--rose);color:#fff}
.opt.picked{border-color:var(--rose-dark);background:linear-gradient(120deg,#fff,#ffe6f1);transform:translateX(5px)}
.opt.picked b{background:var(--rose-dark);color:#fff}
.quiz-foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* ---------- 结果 ---------- */
.result-head{text-align:center;padding:clamp(14px,3vw,30px) 0 26px}
.result-head .eyebrow{margin-bottom:16px}
.result-head h2{font-family:var(--serif);font-size:clamp(24px,3.6vw,34px);font-weight:600;letter-spacing:.06em}
.result-head p{margin-top:14px;font-size:14.4px;color:var(--plum-2);line-height:2}
.profile{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start;margin-bottom:34px}
@media(max-width:820px){.profile{grid-template-columns:1fr}}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,240,247,.75));border:1px solid #fff;
  border-radius:24px;padding:24px 26px;box-shadow:var(--sh-soft)}
.panel h3{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.1em;margin-bottom:18px}
.axisbar{display:grid;gap:14px}
.axisbar .row{display:grid;gap:7px}
.axisbar .lbl{display:flex;justify-content:space-between;font-size:12.8px;color:var(--plum-2)}
.axisbar .lbl em{font-style:normal;color:var(--rose-deep);font-size:12px}
.axisbar .track{height:8px;border-radius:999px;background:rgba(255,188,215,.28);overflow:hidden}
.axisbar .track span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffc9df,#e2749f);transition:width .8s cubic-bezier(.22,.9,.28,1)}
.axisbar .row.top .track span{background:linear-gradient(90deg,#f6a9c6,#c9568a)}
.pcard{border-radius:26px;padding:clamp(22px,3.4vw,34px);position:relative;overflow:hidden;margin-bottom:22px;
  background:linear-gradient(155deg,rgba(255,255,255,.96),rgba(255,238,246,.86));border:1px solid #fff;box-shadow:var(--sh)}
.pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ffc2da,#c9568a)}
.pcard.second{background:linear-gradient(155deg,rgba(255,255,255,.9),rgba(253,244,233,.8))}
.pcard.second::before{background:linear-gradient(180deg,var(--gold-soft),var(--gold))}
.pc-top{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;flex-wrap:wrap}
.pc-badge{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;color:var(--rose-dark);
  background:rgba(255,188,215,.28);border-radius:999px;padding:6px 14px;margin-bottom:14px}
.pcard.second .pc-badge{color:#8a6b2e;background:rgba(239,220,184,.6)}
.pc-name{font-family:var(--serif);font-size:clamp(20px,2.8vw,27px);font-weight:600;letter-spacing:.05em;line-height:1.4}
.pc-name em{font-family:var(--en);font-style:italic;font-size:15px;color:var(--rose-deep);letter-spacing:.08em;margin-left:8px}
.pc-brand{font-size:13px;color:var(--plum-3);margin-top:8px;letter-spacing:.05em}
.pc-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.pc-meta i{font-style:normal;font-size:11.5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.85);
  box-shadow:inset 0 0 0 1px rgba(255,188,215,.7);color:var(--plum-2)}
.pc-meta i.gold{box-shadow:inset 0 0 0 1px var(--gold-soft);color:#8a6b2e}
.ring{flex:none;display:grid;place-items:center;position:relative;width:104px;height:104px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;text-align:center;line-height:1.15}
.ring .val b{font-family:var(--en);font-size:26px;color:var(--rose-dark)}
.ring .val b i{font-style:normal;font-size:13px}
.ring .val span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--plum-3)}
.pyramid{margin-top:24px;display:grid;gap:10px}
.pyramid .pr{display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:center;
  background:rgba(255,255,255,.72);border-radius:14px;padding:12px 16px;border:1px solid rgba(255,255,255,.9)}
.pyramid .pr b{font-family:var(--serif);font-size:13px;letter-spacing:.1em;color:var(--rose-dark);font-weight:600}
.pyramid .pr span{font-size:13.6px;color:var(--plum-2);line-height:1.8}
.pyramid .pr.top-A{background:linear-gradient(90deg,rgba(255,214,231,.55),rgba(255,255,255,.7))}
.pyramid .pr.top-B{background:linear-gradient(90deg,rgba(255,188,215,.5),rgba(255,255,255,.7))}
.pyramid .pr.top-C{background:linear-gradient(90deg,rgba(233,123,164,.34),rgba(255,255,255,.7))}
.pc-desc{margin-top:20px;font-size:14.4px;line-height:2.1;color:var(--plum-2);text-align:justify}
.pc-cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:20px}
.pc-col{background:rgba(255,255,255,.7);border-radius:16px;padding:15px 17px;border:1px solid rgba(255,255,255,.9)}
.pc-col h4{font-family:var(--serif);font-size:13px;letter-spacing:.1em;color:var(--rose-dark);margin-bottom:9px;font-weight:600}
.pc-col p{font-size:13.4px;line-height:1.95;color:var(--plum-2)}
.pcard.second .pc-col h4{color:#8a6b2e}
.others{margin-top:34px}
.others h3{font-family:var(--serif);font-size:16px;letter-spacing:.1em;font-weight:600;margin-bottom:14px}
.others .pv-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.result-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:38px}
footer{position:relative;z-index:3;text-align:center;padding:26px 20px 40px;font-size:12px;color:var(--plum-3);line-height:1.9;letter-spacing:.04em}
footer b{color:var(--rose-deep);font-weight:600;font-family:var(--serif)}
@media(max-width:560px){
  .ring{width:88px;height:88px}
  .pyramid .pr{grid-template-columns:60px 1fr;padding:11px 13px}
  .opt{padding:14px 15px;font-size:14px}
}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i><i></i></div>
<div class="sparkles"></div>

/* =========================================================
   状态与工具
   ========================================================= */
const state = { view:'home', fid:null, qi:0, answers:[], result:null, busy:false };
const app = document.getElementById('app');

/* ---- 打分：把答案映射到四个方向轴，再与每支香的权重做点积 ---- */
function computeResult(f, answers){
  const axes = Object.keys(f.axes);
  const score = {}; axes.forEach(a => score[a] = 0);
  answers.forEach((oi, qi) => {
    const opt = f.questions[qi].options[oi];
    if(!opt) return;
    for(const k in opt.w) score[k] = (score[k] || 0) + opt.w[k];
  });
  /* 每支香的契合度：逐题取「对它最有利的选项」作为满分，再算实际得分占比 */
  const ranked = f.perfumes.map(p => {
    let num = 0, den = 0;
    f.questions.forEach((q, qi) => {
      const opt = q.options[answers[qi]];
      if(opt) for(const k in opt.w) num += opt.w[k] * (p.w[k] || 0);
      let best = 0;
      q.options.forEach(o => {
        let s = 0;
        for(const k in o.w) s += o.w[k] * (p.w[k] || 0);
        if(s > best) best = s;
      });
      den += best;
    });
    const ratio = den ? num / den : 0;
    const pct = Math.max(55, Math.min(99, Math.round(55 + 44 * ratio)));
    return { p, pct, ratio, num };
  }).sort((a, b) => b.ratio - a.ratio);
  /* 用户画像：得分最高的两个方向 */
  const profile = axes.map(a => ({ a, label:f.axes[a], v:score[a] || 0 }))
                      .sort((x, y) => y.v - x.v);
  const maxV = Math.max(1, profile[0].v);
  return { ranked, profile, maxV, score };
}

        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      <defs><linearGradient id="rg${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffb3d1"/><stop offset="1" stop-color="#c9568a"/>
      </linearGradient></defs>
    </svg>
    <div class="val"><b>${pct}<i>%</i></b><span>契合度</span></div>
  </div>`;
}

function viewResult(f){
  const { ranked, profile, maxV } = state.result;
  const top = ranked[0];
  const second = ranked[1];
  const twoRec = second && (second.ratio >= top.ratio * 0.82 || second.pct >= top.pct - 6);
  const others = ranked.slice(twoRec ? 2 : 1, (twoRec ? 2 : 1) + 3);
  const topAxes = profile.filter(x => x.v > 0).slice(0, 2).map(x => x.label);
  const profileText = topAxes.length ? topAxes.join(' × ') : Object.keys(f.axes).slice(0, 2).map(a => f.axes[a]).join(' × ');

  return `
  <div class="view">
    <div class="result-head">
      <span class="eyebrow">${f.icon} ${f.name} · 测试完成</span>
      <h2>你的香气画像是「${profileText}」</h2>
      <p>${twoRec
        ? '你的偏好落在这个香调里两条相邻的路线上，所以下面两支都值得试——它们共享同一片气质，只是温度不同。'
        : `在这个香调里，你的答案相当集中地指向了一种气质，所以我们只推荐一支：它几乎就是为你准备的。`}</p>

      <div class="panel">
        <h3>接下来怎么看</h3>
        <div class="axes-list">
          <div><b></b><span>香水在皮肤上会变，务必在<strong>自己皮肤上</strong>试，并留出 30 分钟以上看中后调。</span></div>
          <div><b></b><span>同香调内不同浓度的表现差别很大：EDT 更清透、EDP 更饱满、香精（Parfum）最厚重，建议先试 EDT/EDP。</span></div>

            <h5>${o.p.n}</h5>
            <span>${o.p.b} · ${o.p.year} · ${o.p.conc}</span>
            <span style="color:var(--plum-3)">${o.p.one}</span>
            <i>${o.p.type}</i>
          </div>`).join('')}
      </div>
    </section>` : ''}

    <div class="result-actions">

/* =========================================================
   渲染
   ========================================================= */
function render(){
  const f = state.fid ? findF(state.fid) : null;
  let html = '';
  if(state.view === 'home') html = viewHome();
  else if(state.view === 'family' && f) html = viewFamily(f);
  else if(state.view === 'quiz' && f) html = viewQuiz(f);
  else if(state.view === 'result' && f) html = viewResult(f);
  else html = viewHome();
  app.innerHTML = html;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce) window.scrollTo({ top:0, behavior:'smooth' });
  else window.scrollTo(0, 0);
}

function goHome(){
  state.view = 'home'; state.fid = null; state.qi = 0; state.answers = []; state.result = null; state.busy = false;
  render();
}

function openFamily(id){
  state.view = 'family'; state.fid = id; state.qi = 0; state.answers = []; state.result = null; state.busy = false;
  render();
}

function startQuiz(id){
  state.view = 'quiz'; state.fid = id; state.qi = 0; state.answers = []; state.result = null; state.busy = false;
  render();
}

function pickOption(i){
  if(state.busy) return;
  state.busy = true;
  const f = findF(state.fid);
  state.answers[state.qi] = i;
  const el = app.querySelector(`.opt[data-i="${i}"]`);
  if(el) el.classList.add('picked');
  const last = state.qi >= f.questions.length - 1;
  setTimeout(() => {
    if(last){
      state.result = computeResult(f, state.answers);
      state.view = 'result';
    } else {
      state.qi++;
    }
    state.busy = false;
    render();
  }, 300);
}

/* =========================================================
   事件（委托）
   ========================================================= */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  if(act === 'home')      goHome();
  else if(act === 'reset') goHome();
  else if(act === 'open')  openFamily(id);
  else if(act === 'start') startQuiz(id);
  else if(act === 'pick')  pickOption(Number(el.dataset.i));
  else if(act === 'prev'){
    if(state.qi > 0){ state.qi--; state.answers.length = state.qi + 1; render(); }
  }
  else if(act === 'scrollGrid'){
    const g = document.getElementById('grid');
    if(g) g.scrollIntoView({ behavior:'smooth', block:'start' });
  }
  else if(act === 'random'){
    const f = FAMILIES[Math.floor(Math.random() * FAMILIES.length)];
    openFamily(f.id);
  }
});
document.querySelector('.topbar').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.dataset.act === 'home' || el.dataset.act === 'reset') goHome();
});
/* 键盘 1-4 / A-D 快速作答 */
document.addEventListener('keydown', e => {
  if(state.view !== 'quiz' || state.busy) return;
  const f = findF(state.fid); if(!f) return;
  const k = e.key.toUpperCase();
  const idx = ['1','2','3','4','5'].indexOf(k) >= 0 ? ['1','2','3','4','5'].indexOf(k) : LETTERS.indexOf(k);
  if(idx >= 0 && idx < f.questions[state.qi].options.length) pickOption(idx);
  if(e.key === 'Escape') goHome();
});

render();
</script>
